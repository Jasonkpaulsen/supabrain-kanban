# SB-446 — refuse a credential before it reaches this public repository.
#
# This workflow is given NO secrets and needs none: it reads files in the
# checkout and exits non-zero. `permissions: contents: read` is the whole grant.
# That is deliberate — a job whose purpose is catching leaked credentials must
# not itself be a place one could leak from.

name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff scan needs the base commit

      - name: Prove the scanner still catches the known incidents
        # Runs FIRST and on its own step. A clean scan from a broken detector is
        # indistinguishable from a clean repository, and this project has
        # already shipped a scan that silently checked nothing (ADR-TEST-002).
        # If this step fails, do not trust the next one.
        run: python3 scripts/secret-scan.py --self-test

      - name: Scan the tree for credentials
        run: python3 scripts/secret-scan.py

      - name: Scan newly pushed commits for grant anti-patterns
        # Push events only, diffing against the branch's PREVIOUS head.
        #
        # The first version diffed against the PR base, which on a long-lived
        # branch marks every file the branch ever added as "new" -- 281 files
        # here -- so a month of applied migrations was re-judged on every PR
        # sync and the job failed on history. Same commit, green on push, red
        # on pull_request.
        #
        # The point of this rule is to catch the author in the act, so the
        # right window is what THIS push added. Applied history is covered by
        # the advisory pass in the previous step and by SB-488's runtime audit.
        if: github.event_name == 'push'
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch, no previous head to diff against; skipping the new-lines pass."
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Previous head $BASE is not in this checkout (force-push or prune); skipping."
            exit 0
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACM "$BASE" HEAD \
                    -- '*.sql' '*.ts' '*.js' '*.json' '*.html' '*.yml' '*.py' '*.sh' || true)
          if [ -z "$CHANGED" ]; then
            echo "No scannable files changed."
            exit 0
          fi
          echo "$CHANGED"
          python3 scripts/secret-scan.py --staged-like $CHANGED
